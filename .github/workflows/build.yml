name: System Scanner

on:
  push:
    branches: [ "main" ]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Unzip project files
      run: unzip -o aniflux.zip
      
    - name: Discover Project Type
      run: |
        echo "===================================="
        echo "📂 FILE SYSTEM SCAN:"
        find . -maxdepth 3
        echo "===================================="
        if find . -name "pubspec.yaml" | grep -q .; then
          echo "✅ This is a FLUTTER project!"
        elif find . -name "build.gradle" | grep -q .; then
          echo "✅ This is a NATIVE ANDROID project!"
        else
          echo "❌ Unknown project type or missing files."
        fi
