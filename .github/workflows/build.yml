name: Android CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Unzip project files
      run: unzip -o aniflux.zip

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission
      run: |
        cd my_app
        chmod +x gradlew

    - name: Build APK
      run: |
        cd my_app
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AniFlux-App
        path: my_app/app/build/outputs/apk/debug/*.apk
